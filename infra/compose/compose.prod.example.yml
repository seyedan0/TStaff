# نمونه فایل Docker Compose برای محیط Staging یا Production تک‌سروره در ایران
services:
  reverse-proxy:
    image: caddy:2-alpine
    container_name: tstaff-proxy
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../proxy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  api:
    image: tstaff-api:latest
    container_name: tstaff-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      FILE_MAX_BYTES: 26214400
      PRIVATE_FILES_DIR: /var/lib/tstaff/private-files
    expose:
      - '4000'
    volumes:
      - private_files:/var/lib/tstaff/private-files

  clamav:
    image: clamav/clamav:stable
    container_name: tstaff-clamav
    restart: always
    expose:
      - '3310'

  worker:
    image: tstaff-worker:latest
    container_name: tstaff-worker
    restart: always
    environment:
      NODE_ENV: production

volumes:
  caddy_data:
  caddy_config:
  private_files:

