services:
  postgres:
    image: postgres:16-alpine
    container_name: tstaff-postgres-dev
    environment:
      POSTGRES_USER: tstaff_user
      POSTGRES_PASSWORD: tstaff_pass
      POSTGRES_DB: tstaff_dev
    ports:
      - '5432:5432'
    volumes:
      - tstaff_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U tstaff_user -d tstaff_dev' ]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: tstaff-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - tstaff_minio_data:/data

volumes:
  tstaff_pg_data:
  tstaff_minio_data:

